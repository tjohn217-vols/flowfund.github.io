<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowFund Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
}

header {
    background: #020617;
    padding: 20px;
    text-align: center;
}

section {
    padding: 30px;
    max-width: 900px;
    margin: auto;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin: 15px 0;
}

input {
    padding: 10px;
    margin: 10px;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}

canvas {
    max-width: 400px;
}
</style>
</head>

<body>

<header>
    <h1 id="welcome">Welcome</h1>
    <p>Your AI Financial Dashboard</p>
</header>

<section>

<div class="card">
    <h3>Enter Your Name</h3>
    <input id="nameInput" placeholder="Your name">
    <button onclick="setName()">Save</button>
</div>

<div class="card">
    <h3>Net Worth</h3>
    <p>$52,400</p>
</div>

<div class="card">
    <h3>Monthly Breakdown</h3>
    <canvas id="chart"></canvas>
</div>

<div class="card">
    <h3>AI Recommendation</h3>
    <p id="aiText">Analyzing your finances...</p>
</div>

<button onclick="window.location.href='index.html'">← Back</button>

</section>

<script>
let chart;

function setName() {
    let name = document.getElementById("nameInput").value;
    document.getElementById("welcome").innerText = "Welcome, " + name;
}

let ctx = document.getElementById('chart');

chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Spending', 'Savings', 'Investing'],
        datasets: [{
            data: [1200, 800, 600]
        }]
    }
});

document.getElementById("aiText").innerText =
    "Based on your profile, increase savings by 10% and reduce discretionary spending.";
</script>

</body>
</html>
