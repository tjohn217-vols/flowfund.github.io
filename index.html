<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowFund</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #f5f7fa;
    --text: #333;
    --card: #ffffff;
    --primary: #0a2540;
}

body.dark {
    --bg: #0f172a;
    --text: #e5e7eb;
    --card: #1e293b;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    background: var(--primary);
    color: white;
    padding: 60px 20px;
    text-align: center;
    animation: fadeIn 1.5s ease-in;
}

.logo {
    font-size: 42px;
    font-weight: bold;
}

.logo span {
    color: #00d4ff;
}

button {
    padding: 12px 20px;
    margin-top: 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.cta {
    background: #00d4ff;
    color: black;
    font-weight: bold;
}

/* DARK MODE */
.toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
}

/* SECTIONS */
section {
    padding: 50px 20px;
    max-width: 1000px;
    margin: auto;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.8s ease;
}

section.show {
    opacity: 1;
    transform: translateY(0);
}

h2 {
    color: var(--primary);
}

/* CARDS */
.features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* DEMO */
.demo {
    text-align: center;
}

input {
    padding: 10px;
    margin: 10px;
}

/* CHART */
canvas {
    max-width: 400px;
    margin: 20px auto;
}

/* FOOTER */
footer {
    background: var(--primary);
    color: white;
    text-align: center;
    padding: 20px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleDark()">🌙</button>

<header>
    <div class="logo">Flow<span>Fund</span></div>
    <p>Your Financial Autopilot</p>
    <button class="cta">Get Started</button>
</header>

<section>
    <h2>About</h2>
    <p>FlowFund automatically adapts your finances based on life changes.</p>
</section>

<section>
    <h2>Features</h2>
    <div class="features">
        <div class="card"><h3>Dynamic Budgeting</h3></div>
        <div class="card"><h3>Life Event AI</h3></div>
        <div class="card"><h3>Goal Investing</h3></div>
        <div class="card"><h3>Simulation Engine</h3></div>
    </div>
</section>

<section>
    <h2>Interactive Demo</h2>

    <div class="demo">
        <input type="number" id="income" placeholder="Income">
        <input type="number" id="expenses" placeholder="Expenses"><br>

        <button onclick="updateChart()">Analyze</button>

        <h3 id="result"></h3>

        <canvas id="chart"></canvas>
    </div>
</section>

<section>
    <h2>Scenario</h2>
    <p>New job? FlowFund reallocates your finances instantly.</p>
</section>

<footer>
    <p>© 2026 FlowFund</p>
</footer>

<script>
let chart;

function updateChart() {
    let income = parseFloat(document.getElementById("income").value);
    let expenses = parseFloat(document.getElementById("expenses").value);
    let savings = income - expenses;

    document.getElementById("result").innerText =
        savings >= 0 ? "Saving $" + savings : "Overspending $" + Math.abs(savings);

    let data = [expenses, savings > 0 ? savings : 0];

    if (chart) chart.destroy();

    let ctx = document.getElementById('chart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Expenses', 'Savings'],
            datasets: [{
                data: data
            }]
        }
    });
}

/* DARK MODE */
function toggleDark() {
    document.body.classList.toggle("dark");
}

/* SCROLL ANIMATION */
const sections = document.querySelectorAll("section");

window.addEventListener("scroll", () => {
    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if (top < window.innerHeight - 100) {
            sec.classList.add("show");
        }
    });
});
</script>

</body>
</html>
